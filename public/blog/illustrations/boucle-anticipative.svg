<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boucle-title boucle-desc">
  <title id="boucle-title">Le principe de la boucle anticipative</title>
  <desc id="boucle-desc">Capteurs (lux, températures, UV, couverture nuageuse, conso, production solaire) alimentent une décision anticipative qui lit les tendances, pondère des conditions, et pilote une action (fermer/ouvrir un volet, brancher/couper une prise). Une boucle de feedback avec hystérésis et mémoire d'état (Redis ou helpers) ré-évalue à chaque tour. Filets de sécurité : reset horaire, fin de plage, seuils critiques.</desc>

  <defs>
    <linearGradient id="bcCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4d"/>
      <stop offset="100%" stop-color="#0f1628"/>
    </linearGradient>
    <linearGradient id="bcCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3a6e"/>
      <stop offset="100%" stop-color="#0f1f3a"/>
    </linearGradient>
    <linearGradient id="bcSafety" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0883e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <marker id="bcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" opacity="0.9"/>
    </marker>
    <marker id="bcArrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0883e" opacity="0.9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#0a0d14" rx="14"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Le principe de la boucle</text>
  <text x="450" y="60" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.14em">LIRE EN PENTE · ANTICIPER · PILOTER</text>

  <!-- Box CAPTEURS (left) -->
  <g>
    <rect x="40" y="100" width="220" height="220" rx="10" fill="url(#bcCard)" stroke="#388bfd" stroke-width="1.5"/>
    <text x="150" y="128" text-anchor="middle" fill="#58a6ff" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.14em">CAPTEURS</text>
    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e6edf3">
      <text x="60" y="158">·  lux baie sud (Hue)</text>
      <text x="60" y="180">·  T° int salon / sé jour</text>
      <text x="60" y="202">·  T° ext jardin (Netatmo)</text>
      <text x="60" y="224">·  UV · couverture nuage</text>
      <text x="60" y="246">·  soleil — azimut / élévation</text>
      <text x="60" y="268">·  conso réseau (Ecojoko)</text>
      <text x="60" y="290">·  prod solaire (1 600 W)</text>
    </g>
    <text x="150" y="310" text-anchor="middle" fill="#6e7681" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic">flux temps réel</text>
  </g>

  <!-- Arrow CAPTEURS → DÉCISION -->
  <line x1="265" y1="210" x2="298" y2="210" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#bcArrow)" opacity="0.95"/>
  <text x="282" y="200" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.1em">tendance</text>

  <!-- Box DÉCISION (center) -->
  <g>
    <rect x="305" y="100" width="290" height="220" rx="10" fill="url(#bcCenter)" stroke="#58a6ff" stroke-width="2"/>
    <text x="450" y="128" text-anchor="middle" fill="#58a6ff" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.14em">DÉCISION ANTICIPATIVE</text>
    <text x="450" y="156" text-anchor="middle" fill="#e6edf3" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">lire en pente, pas en photo</text>
    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e6edf3">
      <text x="325" y="186">·  journée chaude ? (clair · UV · ext ↑)</text>
      <text x="325" y="208">·  faisceau direct sur la baie ?</text>
      <text x="325" y="230">·  soleil couvre la conso ?</text>
      <text x="325" y="252">·  intérieur déjà refroidi ?</text>
      <text x="325" y="274">·  horaire dans la fenêtre ?</text>
    </g>
    <text x="450" y="300" text-anchor="middle" fill="#8b949e" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic">conjonction de conditions · stabilité sur N scans</text>
  </g>

  <!-- Arrow DÉCISION → ACTION -->
  <line x1="600" y1="210" x2="633" y2="210" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#bcArrow)" opacity="0.95"/>
  <text x="617" y="200" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.1em">action</text>

  <!-- Box ACTION (right) -->
  <g>
    <rect x="640" y="100" width="220" height="220" rx="10" fill="url(#bcCard)" stroke="#388bfd" stroke-width="1.5"/>
    <text x="750" y="128" text-anchor="middle" fill="#58a6ff" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="0.14em">ACTION</text>
    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e6edf3">
      <text x="660" y="162">·  fermer volet</text>
      <text x="660" y="184">·  rouvrir volet</text>
      <text x="660" y="206">·  brancher prise</text>
      <text x="660" y="228">·  couper prise</text>
      <text x="660" y="262" font-style="italic" fill="#8b949e" font-size="12">→ volets sud / est</text>
      <text x="660" y="282" font-style="italic" fill="#8b949e" font-size="12">→ déshu HC · extracteur</text>
      <text x="660" y="302" font-style="italic" fill="#8b949e" font-size="12">→ trottinette · chargeur</text>
    </g>
  </g>

  <!-- Loop arrow (ACTION → CAPTEURS) — feedback with hysteresis -->
  <path d="M 750 320 Q 750 380 450 380 Q 150 380 150 320"
        fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="6 4" opacity="0.9" marker-end="url(#bcArrowOrange)"/>
  <text x="450" y="372" text-anchor="middle" fill="#f0883e" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">hystérésis · mémoire d'état (Redis / helpers)</text>
  <text x="450" y="392" text-anchor="middle" fill="#8b949e" font-family="Inter, system-ui, sans-serif" font-size="11" font-style="italic">re-mesure · seuils start / stop différenciés · anti yo-yo</text>

  <!-- Safety nets band -->
  <rect x="40" y="410" width="820" height="50" rx="10" fill="url(#bcSafety)" stroke="#f0883e" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="68" y="441" fill="#f0883e" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.14em" font-weight="700">FILETS DE SÉCURITÉ</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e6edf3">
    <text x="280" y="441">reset matinal 7h</text>
    <text x="420" y="441" fill="#8b949e">·</text>
    <text x="475" y="441">fin de plage 17h</text>
    <text x="595" y="441" fill="#8b949e">·</text>
    <text x="700" y="441">seuils critiques</text>
  </g>
</svg>
